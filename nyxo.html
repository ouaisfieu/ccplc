<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NYXO v3 — Experimental Interface</title>

<style>
/* =========================================================
   NYXO v3 — PRINCIPES
   - pas un faux Windows
   - pas une vitrine CCPLC
   - interface modulaire / console / zones
   - mobile-first, scrollable
   - vert tendre / lilas néon, glitch contrôlé
   ========================================================= */

/* ---------- TOKENS ---------- */
:root{
  --bg:#05060b;
  --bg-soft:#0b0e1a;
  --panel:#11142a;
  --border:#242861;

  --text:#eef0ff;
  --muted:#9aa0d6;

  --green:#7cffc4;
  --lilas:#cbb7ff;
  --danger:#ff4d7d;

  --radius:14px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

/* ---------- RESET ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 500px at 50% -10%, #13163a 0%, var(--bg) 60%);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
}

/* ---------- GLOBAL LAYOUT ---------- */
#nyxo{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  position:sticky;
  top:0;
  z-index:10;
  background:rgba(5,6,11,.9);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}

.header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:.8rem 1rem;
}

.brand{
  font-family:var(--mono);
  font-weight:800;
  letter-spacing:.14em;
  color:var(--green);
}

.header-status{
  font-size:.75rem;
  color:var(--muted);
}

/* ---------- MAIN GRID ---------- */
main{
  flex:1;
  display:grid;
  grid-template-columns:1fr;
  gap:1rem;
  padding:1rem;
}

/* ---------- MODULE BASE ---------- */
.module{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:1rem;
  display:flex;
  flex-direction:column;
  gap:.6rem;
}

.module h2{
  margin:0;
  font-size:.9rem;
  text-transform:uppercase;
  letter-spacing:.08em;
  color:var(--lilas);
}

/* ---------- CONSOLE ---------- */
.console{
  font-family:var(--mono);
  font-size:.8rem;
  background:#000;
  border-radius:10px;
  padding:.6rem;
  overflow:auto;
  min-height:8rem;
}

.console-line{
  white-space:pre-wrap;
  line-height:1.4;
}

.console .ok{color:var(--green)}
.console .warn{color:#ffcf5c}
.console .err{color:var(--danger)}

/* ---------- COMMAND INPUT ---------- */
.cmd{
  display:flex;
  gap:.4rem;
}
.cmd input{
  flex:1;
  background:#000;
  border:1px solid var(--border);
  color:var(--text);
  font-family:var(--mono);
  font-size:.8rem;
  padding:.35rem .5rem;
  border-radius:999px;
}
.cmd input:focus{outline:1px solid var(--green)}

/* ---------- FILE SPACE ---------- */
.file-list{
  font-family:var(--mono);
  font-size:.75rem;
  border:1px solid var(--border);
  border-radius:10px;
  background:#000;
  max-height:10rem;
  overflow:auto;
}
.file-item{
  padding:.3rem .5rem;
  border-bottom:1px solid rgba(255,255,255,.05);
}
.file-item:last-child{border-bottom:none}

/* ---------- KALI MODE ---------- */
.kali{
  font-family:var(--mono);
  font-size:.75rem;
  background:linear-gradient(180deg,#000,#041c14);
  border:1px solid rgba(0,255,179,.4);
  border-radius:10px;
  padding:.5rem;
}

.kali strong{color:#00ffb3}

/* ---------- CYBER FEAR ---------- */
.alert{
  border:1px solid rgba(255,0,86,.6);
  background:radial-gradient(circle at top left,#300010,#05000a);
  border-radius:10px;
  padding:.6rem;
  font-family:var(--mono);
  font-size:.75rem;
}

/* ---------- GLITCH ---------- */
.glitch{
  position:relative;
}
.glitch::before,
.glitch::after{
  content:attr(data-text);
  position:absolute;
  inset:0;
  opacity:.12;
}
.glitch::before{color:var(--lilas);transform:translate(1px,-1px)}
.glitch::after{color:var(--green);transform:translate(-1px,1px)}

/* ---------- RESPONSIVE ---------- */
@media(min-width:900px){
  main{
    grid-template-columns:2fr 1fr;
  }
}
</style>
</head>

<body>
<div id="nyxo">

<header>
  <div class="header-inner">
    <div class="brand glitch" data-text="NYXO">NYXO</div>
    <div class="header-status">session locale · navigateur only</div>
  </div>
</header>

<main>

  <!-- CONSOLE CENTRALE -->
  <section class="module">
    <h2>Console</h2>
    <div class="console" id="console"></div>
    <div class="cmd">
      <input id="cmdInput" placeholder="commande : help, scan, files, clear…">
    </div>
  </section>

  <!-- DROITE : MODULES -->
  <section class="module">
    <h2>DISK:/</h2>
    <div class="file-list" id="files"></div>
  </section>

  <section class="module">
    <h2>Mode Kali</h2>
    <div class="kali" id="kali"></div>
  </section>

  <section class="module">
    <h2>Alerte Cyber</h2>
    <div class="alert" id="alert"></div>
  </section>

</main>
</div>

<script>
/* =========================================================
   NYXO v3 — LOGIQUE
   ========================================================= */

const consoleEl = document.getElementById("console");
const inputEl   = document.getElementById("cmdInput");
const filesEl   = document.getElementById("files");
const kaliEl    = document.getElementById("kali");
const alertEl   = document.getElementById("alert");

const DISK_KEY = "nyxo_v3_disk";

function log(text, cls=""){
  const div=document.createElement("div");
  div.className="console-line "+cls;
  div.textContent=text;
  consoleEl.appendChild(div);
  consoleEl.scrollTop=consoleEl.scrollHeight;
}

function loadDisk(){
  return JSON.parse(localStorage.getItem(DISK_KEY)||"{}");
}
function saveDisk(d){
  localStorage.setItem(DISK_KEY,JSON.stringify(d));
}

function refreshFiles(){
  const d=loadDisk();
  filesEl.innerHTML="";
  const keys=Object.keys(d);
  if(!keys.length){
    filesEl.innerHTML='<div class="file-item">(vide)</div>';
    return;
  }
  keys.forEach(k=>{
    const div=document.createElement("div");
    div.className="file-item";
    div.textContent=k+" ("+d[k].length+" chars)";
    filesEl.appendChild(div);
  });
}

/* -------- KALI REPORT -------- */
function kaliScan(){
  const n=navigator;
  kaliEl.innerHTML=
`UA: ${n.userAgent}
Langue: ${n.language}
Plateforme: ${n.platform}
Cœurs: ${n.hardwareConcurrency||"?"}
Mémoire: ${n.deviceMemory||"?"} GiB
Écran: ${screen.width}x${screen.height}
Online: ${n.onLine}`;
}

/* -------- CYBER FEAR -------- */
function cyberFear(){
  alertEl.textContent=
`ATTENTION :
Votre navigateur expose :
- empreinte logicielle
- fuseau horaire
- capacités matérielles
- stockage local persistant

Corrélation possible.
Risque de profilage.`;
}

/* -------- COMMANDES -------- */
function exec(cmd){
  const d=loadDisk();
  if(cmd==="help"){
    log("Commandes: help, scan, kali, fear, files, clear","ok");
  }
  else if(cmd==="scan"){
    log("Scan environnement…","warn");
    log("Navigator, screen, storage détectés.","ok");
  }
  else if(cmd==="kali"){
    kaliScan();
    log("Rapport Kali généré.","ok");
  }
  else if(cmd==="fear"){
    cyberFear();
    log("Module de sensibilisation activé.","err");
  }
  else if(cmd==="files"){
    refreshFiles();
    log("DISK:/ listé.","ok");
  }
  else if(cmd==="clear"){
    consoleEl.innerHTML="";
  }
  else{
    log("Commande inconnue.","err");
  }
}

/* -------- INIT -------- */
log("NYXO v3 initialisé.","ok");
log("Tape 'help' pour commencer.");

inputEl.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    exec(inputEl.value.trim());
    inputEl.value="";
  }
});

refreshFiles();
kaliScan();
cyberFear();
</script>
</body>
</html>
