<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PéTAL OS — v329.2</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    :root {
      --bg1: #fafafa;
      --bg2: #ffffff;
      --bg3: #f0f0f0;
      --text1: #1a1a1a;
      --text2: #555555;
      --text3: #888888;
      --accent: #2563eb;
      --accent2: #3b82f6;
      --success: #059669;
      --border: #e0e0e0;
    }

    .dark {
      --bg1: #111111;
      --bg2: #1a1a1a;
      --bg3: #252525;
      --text1: #f0f0f0;
      --text2: #aaaaaa;
      --text3: #666666;
      --accent: #60a5fa;
      --accent2: #93c5fd;
      --border: #333333;
    }

    .warm {
      --bg1: #fef7ed;
      --bg2: #fffbf5;
      --bg3: #fef0db;
      --text1: #292524;
      --text2: #57534e;
      --text3: #a8a29e;
      --accent: #ea580c;
      --accent2: #f97316;
      --border: #e7e5e4;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg1);
      color: var(--text1);
      display: flex;
      flex-direction: column;
      -webkit-text-size-adjust: 100%;
    }

    /* ═══════════════════════════════════════════
       HEADER
    ═══════════════════════════════════════════ */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 50;
    }

    .logo { display: flex; align-items: center; gap: 8px; }
    .logo h1 { font-size: 16px; font-weight: 600; }
    .logo .ver { font-size: 10px; padding: 2px 8px; background: var(--accent); color: white; border-radius: 10px; }

    .header-btns { display: flex; gap: 8px; }
    .hbtn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: var(--bg3);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    /* ═══════════════════════════════════════════
       MAIN LAYOUT
    ═══════════════════════════════════════════ */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ═══════════════════════════════════════════
       NAV PANEL (MOBILE SLIDE)
    ═══════════════════════════════════════════ */
    .nav-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
    }
    .nav-overlay.show { display: block; }

    .nav {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      max-width: 85%;
      background: var(--bg2);
      z-index: 200;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.3s ease;
      overflow: hidden;
    }
    .nav.open { transform: translateX(0); }

    .nav-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .nav-head h2 { font-size: 14px; font-weight: 600; color: var(--text3); }
    .nav-close {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      background: none;
      border: none;
      color: var(--text2);
      cursor: pointer;
    }

    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }

    .nav-list {
      list-style: none;
      padding: 8px 0;
    }

    .nav-item {
      padding: 16px 20px;
      font-size: 16px;
      color: var(--text2);
      cursor: pointer;
      border-left: 4px solid transparent;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-item.active {
      background: rgba(37, 99, 235, 0.1);
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 600;
    }

    /* ═══════════════════════════════════════════
       CONTENT AREA
    ═══════════════════════════════════════════ */
    .content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: var(--bg3);
      padding: 16px;
    }

    /* ═══════════════════════════════════════════
       SETTINGS PANEL (BOTTOM)
    ═══════════════════════════════════════════ */
    .settings {
      background: var(--bg2);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      max-height: 50%;
      display: flex;
      flex-direction: column;
    }

    .settings-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .settings-head h3 { font-size: 12px; font-weight: 600; color: var(--text3); text-transform: uppercase; }
    .settings-head .arrow { transition: transform 0.3s; }
    .settings.closed .arrow { transform: rotate(180deg); }

    .settings-scroll {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 16px 16px;
    }
    .settings.closed .settings-scroll { display: none; }

    .sgroup { margin-bottom: 12px; }
    .sgroup label { display: block; font-size: 11px; font-weight: 600; color: var(--text1); margin-bottom: 4px; }
    .sgroup select, .sgroup textarea {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      font-family: inherit;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text1);
      -webkit-appearance: none;
    }
    .sgroup textarea { min-height: 50px; resize: none; }

    .checks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .checks label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 400;
      color: var(--text2);
      cursor: pointer;
    }
    .checks input { width: 18px; height: 18px; }

    /* ═══════════════════════════════════════════
       DESKTOP LAYOUT
    ═══════════════════════════════════════════ */
    @media (min-width: 768px) {
      .hbtn.menu { display: none; }
      .nav-overlay { display: none !important; }
      
      .main { flex-direction: row; }
      
      .nav {
        position: relative;
        transform: none;
        width: 220px;
        flex-shrink: 0;
        border-right: 1px solid var(--border);
      }
      .nav-close { display: none; }

      .content { flex: 1; }

      .settings {
        width: 300px;
        flex-shrink: 0;
        border-top: none;
        border-left: 1px solid var(--border);
        max-height: none;
      }
      .settings-head { cursor: default; }
      .settings-head .arrow { display: none; }
      .settings.closed .settings-scroll { display: block; }
    }

    /* ═══════════════════════════════════════════
       MODULE: ACCUEIL
    ═══════════════════════════════════════════ */
    .mod-home {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      min-height: 50vh;
      padding: 32px;
    }
    .mod-home .icon { font-size: 64px; margin-bottom: 16px; }
    .mod-home h2 { font-family: 'Merriweather', serif; font-size: 28px; margin-bottom: 8px; }
    .mod-home p { color: var(--text2); max-width: 300px; line-height: 1.6; }
    .mod-home .badge { margin-top: 20px; padding: 8px 16px; background: var(--accent); color: white; border-radius: 20px; font-size: 13px; }

    /* ═══════════════════════════════════════════
       MODULE: PERCEPTION
    ═══════════════════════════════════════════ */
    .mod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 4px; }
    .mod-grid .cell {
      aspect-ratio: 1;
      background: var(--bg2);
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .mod-grid .cell.on { background: var(--accent); border-color: var(--accent); }

    /* ═══════════════════════════════════════════
       MODULE: MÉMOIRE
    ═══════════════════════════════════════════ */
    .mod-notes { max-width: 500px; margin: 0 auto; }
    .note { padding: 16px 0; border-bottom: 1px solid var(--border); }
    .note-date { font-size: 11px; color: var(--text3); font-family: monospace; }
    .note-text { font-family: 'Merriweather', serif; font-size: 16px; color: var(--text2); margin-top: 4px; font-style: italic; }
    .note-input {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      font-size: 15px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text1);
    }

    /* ═══════════════════════════════════════════
       MODULE: CRÉATIVITÉ
    ═══════════════════════════════════════════ */
    .mod-canvas {
      background: var(--bg2);
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }
    .mod-canvas canvas {
      display: block;
      width: 100%;
      height: 350px;
      touch-action: none;
    }
    .mod-canvas .hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--text3);
      background: var(--bg2);
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    /* ═══════════════════════════════════════════
       MODULE: GÉNÉRATEUR
    ═══════════════════════════════════════════ */
    .mod-gen { max-width: 700px; margin: 0 auto; }

    .gen-input {
      text-align: center;
      margin-bottom: 20px;
    }
    .gen-input input {
      width: 100%;
      padding: 16px 20px;
      font-size: 16px;
      background: var(--bg2);
      border: 2px solid var(--border);
      border-radius: 30px;
      color: var(--text1);
      text-align: center;
    }
    .gen-input input:focus { outline: none; border-color: var(--accent); }
    .gen-input .hint { font-size: 12px; color: var(--text3); margin-top: 8px; }

    .gen-cards { display: flex; flex-direction: column; gap: 16px; }

    .gcard {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .gcard-head {
      padding: 16px;
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
    }
    .gcard-title { font-family: 'Merriweather', serif; font-size: 18px; margin-bottom: 8px; }
    .gcard-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .gcard-date { font-size: 11px; color: var(--text3); font-family: monospace; }
    .gcard-badge { font-size: 10px; padding: 3px 8px; background: var(--success); color: white; border-radius: 10px; }
    .gcard-btns { display: flex; gap: 8px; margin-top: 12px; }
    .gcard-btn {
      padding: 10px 16px;
      font-size: 13px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .gcard-preview { background: var(--bg3); }
    .gcard-preview iframe { width: 100%; height: 200px; border: none; display: block; }

    .gcard-info { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 12px 16px; }
    .ginfo { text-align: center; padding: 8px; background: var(--bg3); border-radius: 6px; }
    .ginfo-label { font-size: 9px; color: var(--text3); text-transform: uppercase; }
    .ginfo-value { font-size: 12px; font-weight: 600; margin-top: 2px; }

    .gcard-sources { padding: 12px 16px; background: var(--bg3); border-top: 1px solid var(--border); }
    .gcard-sources-title { font-size: 10px; color: var(--text3); text-transform: uppercase; margin-bottom: 6px; }
    .gcard-sources-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .gsource { font-size: 11px; padding: 4px 8px; background: var(--bg2); border-radius: 4px; }

    /* ═══════════════════════════════════════════
       MODAL
    ═══════════════════════════════════════════ */
    .modal-bg {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      z-index: 500;
      padding: 16px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .modal-bg.show { display: flex; align-items: flex-start; justify-content: center; padding-top: 5%; }

    .modal {
      background: var(--bg2);
      border-radius: 12px;
      width: 100%;
      max-width: 800px;
      max-height: 90vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-head h2 { font-size: 18px; }
    .modal-x {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      background: var(--bg3);
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 16px;
    }

    .modal-section { margin-bottom: 16px; }
    .modal-section h3 { font-size: 12px; font-weight: 600; color: var(--text3); margin-bottom: 8px; text-transform: uppercase; }
    .modal-section textarea {
      width: 100%;
      min-height: 180px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text1);
      resize: vertical;
    }
    .modal-section iframe { width: 100%; height: 280px; border: none; border-radius: 8px; background: white; }

    .modal-foot {
      display: flex;
      gap: 12px;
      padding: 16px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .modal-btn {
      flex: 1;
      padding: 14px;
      font-size: 15px;
      font-weight: 500;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    .modal-btn.pri { background: var(--accent); color: white; }
    .modal-btn.sec { background: var(--bg3); color: var(--text2); }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <h1>PéTAL OS</h1>
      <span class="ver">329.2</span>
    </div>
    <div class="header-btns">
      <button class="hbtn" id="themeBtn" onclick="cycleTheme()">☀️</button>
      <button class="hbtn menu" onclick="openNav()">☰</button>
    </div>
  </header>

  <!-- NAV OVERLAY -->
  <div class="nav-overlay" id="navOverlay" onclick="closeNav()"></div>

  <!-- MAIN -->
  <main class="main">
    <!-- NAV -->
    <nav class="nav" id="nav">
      <div class="nav-head">
        <h2>MODULES</h2>
        <button class="nav-close" onclick="closeNav()">×</button>
      </div>
      <div class="nav-scroll">
        <ul class="nav-list" id="navList"></ul>
      </div>
    </nav>

    <!-- CONTENT -->
    <section class="content" id="content"></section>

    <!-- SETTINGS -->
    <aside class="settings" id="settings">
      <div class="settings-head" onclick="toggleSettings()">
        <h3>Paramètres</h3>
        <span class="arrow">▲</span>
      </div>
      <div class="settings-scroll" id="settingsContent"></div>
    </aside>
  </main>

  <!-- MODAL -->
  <div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle">Éditeur</h2>
        <button class="modal-x" onclick="closeModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="modal-section">
          <h3>Code HTML</h3>
          <textarea id="modalCode"></textarea>
        </div>
        <div class="modal-section">
          <h3>Aperçu</h3>
          <iframe id="modalPreview"></iframe>
        </div>
      </div>
      <div class="modal-foot">
        <button class="modal-btn sec" onclick="refreshModal()">🔄 Rafraîchir</button>
        <button class="modal-btn pri" onclick="downloadModal()">💾 Télécharger</button>
      </div>
    </div>
  </div>

  <script>
    // ════════════════════════════════════════════════════════════
    // STATE
    // ════════════════════════════════════════════════════════════
    var sites = [];
    var editIdx = -1;
    var theme = 0;
    var themes = ['', 'dark', 'warm'];
    var themeIcons = ['☀️', '🌙', '🍂'];

    var config = {
      audience: 'adulte',
      detail: 'standard',
      context: '',
      sec: { intro: true, wiki: true, points: true, timeline: true, sources: true, quiz: true }
    };

    // ════════════════════════════════════════════════════════════
    // MODULES
    // ════════════════════════════════════════════════════════════
    var modules = [
      { id: 'home', name: 'Accueil', info: '<p>Bienvenue sur <strong>PéTAL OS</strong> v329.2</p>' },
      { id: 'grid', name: 'Perception', info: '<p>Grille interactive</p>' },
      { id: 'notes', name: 'Mémoire', info: '<p>Vos notes</p>' },
      { id: 'canvas', name: 'Créativité', info: '<p>Dessinez librement</p>' },
      { id: 'gen', name: 'Générateur', info: 'config' }
    ];

    var currentMod = null;

    // ════════════════════════════════════════════════════════════
    // NAV
    // ════════════════════════════════════════════════════════════
    function openNav() {
      document.getElementById('nav').classList.add('open');
      document.getElementById('navOverlay').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeNav() {
      document.getElementById('nav').classList.remove('open');
      document.getElementById('navOverlay').classList.remove('show');
      document.body.style.overflow = '';
    }

    function toggleSettings() {
      if (window.innerWidth < 768) {
        document.getElementById('settings').classList.toggle('closed');
      }
    }

    function cycleTheme() {
      theme = (theme + 1) % 3;
      document.body.className = themes[theme];
      document.getElementById('themeBtn').textContent = themeIcons[theme];
    }

    // ════════════════════════════════════════════════════════════
    // LOAD MODULE
    // ════════════════════════════════════════════════════════════
    function loadMod(id) {
      currentMod = id;
      
      // Update nav
      var items = document.querySelectorAll('.nav-item');
      for (var i = 0; i < items.length; i++) {
        items[i].classList.toggle('active', items[i].getAttribute('data-id') === id);
      }

      // Render content
      var html = '';
      if (id === 'home') html = renderHome();
      else if (id === 'grid') html = renderGrid();
      else if (id === 'notes') html = renderNotes();
      else if (id === 'canvas') html = renderCanvas();
      else if (id === 'gen') html = renderGen();

      document.getElementById('content').innerHTML = html;

      // Render settings
      var mod = null;
      for (var i = 0; i < modules.length; i++) {
        if (modules[i].id === id) mod = modules[i];
      }
      
      if (mod && mod.info === 'config') {
        document.getElementById('settingsContent').innerHTML = renderConfig();
        document.getElementById('settings').style.display = '';
      } else if (mod) {
        document.getElementById('settingsContent').innerHTML = mod.info;
        document.getElementById('settings').style.display = '';
      }

      closeNav();

      // Post-render
      if (id === 'canvas') setTimeout(initCanvas, 100);
      if (id === 'gen') setTimeout(initGen, 100);
      if (id === 'notes') setTimeout(initNotes, 100);
      if (id === 'grid') setTimeout(initGrid, 100);
    }

    // ════════════════════════════════════════════════════════════
    // RENDERERS
    // ════════════════════════════════════════════════════════════
    function renderHome() {
      return '<div class="mod-home">' +
        '<div class="icon">📖</div>' +
        '<h2>Bienvenue</h2>' +
        '<p>Générez des fiches éducatives avec sources officielles et vérifiées.</p>' +
        '<div class="badge">Version 329.2</div>' +
        '</div>';
    }

    function renderGrid() {
      var h = '<div class="mod-grid">';
      for (var i = 0; i < 80; i++) {
        h += '<div class="cell" data-i="' + i + '"></div>';
      }
      return h + '</div>';
    }

    function initGrid() {
      var cells = document.querySelectorAll('.mod-grid .cell');
      for (var i = 0; i < cells.length; i++) {
        cells[i].addEventListener('click', function() {
          this.classList.toggle('on');
        });
      }
    }

    function renderNotes() {
      return '<div class="mod-notes">' +
        '<div class="note"><div class="note-date">2024-03-15</div><div class="note-text">Apprendre, c\'est découvrir.</div></div>' +
        '<div class="note"><div class="note-date">2024-02-28</div><div class="note-text">La connaissance grandit quand on la partage.</div></div>' +
        '<input type="text" class="note-input" id="noteInput" placeholder="Ajouter une note...">' +
        '</div>';
    }

    function initNotes() {
      var input = document.getElementById('noteInput');
      if (input) {
        input.addEventListener('keypress', function(e) {
          if (e.key === 'Enter' && this.value.trim()) {
            var container = document.querySelector('.mod-notes');
            var note = document.createElement('div');
            note.className = 'note';
            note.innerHTML = '<div class="note-date">' + new Date().toISOString().split('T')[0] + '</div><div class="note-text">' + this.value + '</div>';
            container.insertBefore(note, this);
            this.value = '';
          }
        });
      }
    }

    function renderCanvas() {
      return '<div class="mod-canvas">' +
        '<canvas id="canvas"></canvas>' +
        '<div class="hint">Touchez pour dessiner</div>' +
        '</div>';
    }

    function initCanvas() {
      var canvas = document.getElementById('canvas');
      if (!canvas) return;

      var ctx = canvas.getContext('2d');
      var rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      var particles = [];
      var mouse = { x: canvas.width / 2, y: canvas.height / 2 };
      var hue = 210;

      function Particle(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 3 + 1;
        this.vx = (Math.random() - 0.5) * 2;
        this.vy = (Math.random() - 0.5) * 2;
        this.life = 1;
        this.hue = hue + Math.random() * 30;
      }

      function animate() {
        ctx.fillStyle = 'rgba(250,250,250,0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (var i = 0; i < 2; i++) {
          particles.push(new Particle(mouse.x + (Math.random() - 0.5) * 30, mouse.y + (Math.random() - 0.5) * 30));
        }

        var next = [];
        for (var i = 0; i < particles.length; i++) {
          var p = particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.life -= 0.015;
          p.size *= 0.99;

          if (p.life > 0) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = 'hsla(' + p.hue + ',60%,50%,' + p.life + ')';
            ctx.fill();
            next.push(p);
          }
        }
        particles = next;
        hue = (hue + 0.2) % 360;
        requestAnimationFrame(animate);
      }

      canvas.addEventListener('mousemove', function(e) {
        var r = canvas.getBoundingClientRect();
        mouse.x = e.clientX - r.left;
        mouse.y = e.clientY - r.top;
      });

      canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        var r = canvas.getBoundingClientRect();
        mouse.x = e.touches[0].clientX - r.left;
        mouse.y = e.touches[0].clientY - r.top;
      }, { passive: false });

      animate();
    }

    function renderGen() {
      var cards = '';
      for (var i = 0; i < sites.length; i++) {
        cards += renderCard(sites[i], i);
      }
      return '<div class="mod-gen">' +
        '<div class="gen-input">' +
        '<input type="text" id="genInput" placeholder="Entrez un sujet...">' +
        '<div class="hint">Appuyez sur Entrée pour générer</div>' +
        '</div>' +
        '<div class="gen-cards" id="genCards">' + cards + '</div>' +
        '</div>';
    }

    function renderCard(site, idx) {
      var sources = '';
      for (var i = 0; i < site.sources.length; i++) {
        sources += '<span class="gsource">' + site.sources[i] + '</span>';
      }

      return '<div class="gcard">' +
        '<div class="gcard-head">' +
        '<div class="gcard-title">' + site.subject + '</div>' +
        '<div class="gcard-meta">' +
        '<span class="gcard-date">' + site.date + '</span>' +
        '<span class="gcard-badge">✓ Vérifié</span>' +
        '</div>' +
        '<div class="gcard-btns">' +
        '<button class="gcard-btn" onclick="openModal(' + idx + ')">✏️ Éditer</button>' +
        '<button class="gcard-btn" onclick="downloadSite(' + idx + ')">💾 Export</button>' +
        '</div>' +
        '</div>' +
        '<div class="gcard-preview"><iframe id="pv' + idx + '"></iframe></div>' +
        '<div class="gcard-info">' +
        '<div class="ginfo"><div class="ginfo-label">Public</div><div class="ginfo-value">' + site.audience + '</div></div>' +
        '<div class="ginfo"><div class="ginfo-label">Niveau</div><div class="ginfo-value">' + site.level + '</div></div>' +
        '<div class="ginfo"><div class="ginfo-label">Sections</div><div class="ginfo-value">' + site.sections + '</div></div>' +
        '<div class="ginfo"><div class="ginfo-label">Quiz</div><div class="ginfo-value">' + (site.quiz ? 'Oui' : 'Non') + '</div></div>' +
        '</div>' +
        '<div class="gcard-sources">' +
        '<div class="gcard-sources-title">Sources</div>' +
        '<div class="gcard-sources-list">' + sources + '</div>' +
        '</div>' +
        '</div>';
    }

    function initGen() {
      var input = document.getElementById('genInput');
      if (input) {
        input.addEventListener('keypress', function(e) {
          if (e.key === 'Enter' && this.value.trim()) {
            readConfig();
            var site = makeSite(this.value.trim());
            sites.unshift(site);
            loadMod('gen');
          }
        });
      }

      // Load iframes
      for (var i = 0; i < sites.length; i++) {
        var iframe = document.getElementById('pv' + i);
        if (iframe) iframe.srcdoc = sites[i].html;
      }
    }

    function renderConfig() {
      return '<div class="sgroup"><label>🎯 Public</label>' +
        '<select id="cfgAud">' +
        '<option value="enfant">Enfants</option>' +
        '<option value="ado">Adolescents</option>' +
        '<option value="adulte" selected>Adultes</option>' +
        '<option value="expert">Experts</option>' +
        '</select></div>' +
        '<div class="sgroup"><label>📚 Niveau</label>' +
        '<select id="cfgLvl">' +
        '<option value="essentiel">Essentiel</option>' +
        '<option value="standard" selected>Standard</option>' +
        '<option value="complet">Complet</option>' +
        '</select></div>' +
        '<div class="sgroup"><label>📑 Sections</label>' +
        '<div class="checks">' +
        '<label><input type="checkbox" id="cfgIntro" checked> Intro</label>' +
        '<label><input type="checkbox" id="cfgWiki" checked> Wikipédia</label>' +
        '<label><input type="checkbox" id="cfgPoints" checked> Points clés</label>' +
        '<label><input type="checkbox" id="cfgTime" checked> Timeline</label>' +
        '<label><input type="checkbox" id="cfgSrc" checked> Sources</label>' +
        '<label><input type="checkbox" id="cfgQuiz" checked> Quiz</label>' +
        '</div></div>' +
        '<div class="sgroup"><label>🏷️ Contexte</label>' +
        '<textarea id="cfgCtx" placeholder="Ex: Cours de SVT 3ème..."></textarea></div>';
    }

    function readConfig() {
      var el;
      el = document.getElementById('cfgAud'); if (el) config.audience = el.value;
      el = document.getElementById('cfgLvl'); if (el) config.detail = el.value;
      el = document.getElementById('cfgCtx'); if (el) config.context = el.value;
      el = document.getElementById('cfgIntro'); if (el) config.sec.intro = el.checked;
      el = document.getElementById('cfgWiki'); if (el) config.sec.wiki = el.checked;
      el = document.getElementById('cfgPoints'); if (el) config.sec.points = el.checked;
      el = document.getElementById('cfgTime'); if (el) config.sec.timeline = el.checked;
      el = document.getElementById('cfgSrc'); if (el) config.sec.sources = el.checked;
      el = document.getElementById('cfgQuiz'); if (el) config.sec.quiz = el.checked;
    }

    // ════════════════════════════════════════════════════════════
    // SITE GENERATOR
    // ════════════════════════════════════════════════════════════
    function makeSite(subject) {
      var now = new Date();
      var wiki = encodeURIComponent(subject.replace(/\s+/g, '_'));
      var c = config;

      var audLabels = { enfant: 'Enfants', ado: 'Ados', adulte: 'Adultes', expert: 'Experts' };
      var intro = c.audience === 'enfant'
        ? 'Tu veux tout savoir sur <strong>' + subject + '</strong> ? C\'est parti !'
        : '<strong>' + subject + '</strong> est un sujet important à comprendre.';

      var sections = '';
      var count = 0;

      if (c.sec.intro) {
        count++;
        sections += '<section class="card"><h2>📖 Introduction</h2><p class="lead">' + intro + '</p>';
        if (c.context) sections += '<div class="ctx"><strong>📌</strong> ' + c.context + '</div>';
        sections += '</section>';
      }

      if (c.sec.wiki) {
        count++;
        sections += '<section class="card"><h2>📚 Wikipédia</h2>' +
          '<div class="wiki"><p><strong>' + subject + '</strong> — Consultez l\'article complet.</p>' +
          '<a href="https://fr.wikipedia.org/wiki/' + wiki + '" target="_blank">→ Lire sur Wikipédia</a></div></section>';
      }

      if (c.sec.points) {
        count++;
        sections += '<section class="card"><h2>✅ Points Essentiels</h2><ul class="pts">' +
          '<li><b>Définition :</b> Compréhension du sujet</li>' +
          '<li><b>Histoire :</b> Origines et évolution</li>' +
          '<li><b>Aujourd\'hui :</b> Applications actuelles</li>' +
          '</ul></section>';
      }

      if (c.sec.timeline) {
        count++;
        sections += '<section class="card"><h2>📅 Chronologie</h2><div class="tl">' +
          '<div class="tl-i"><span class="tl-d">🕐 Débuts</span><span class="tl-c">Premières mentions</span></div>' +
          '<div class="tl-i"><span class="tl-d">📈 Expansion</span><span class="tl-c">Développement</span></div>' +
          '<div class="tl-i now"><span class="tl-d">✨ Aujourd\'hui</span><span class="tl-c">État actuel</span></div>' +
          '</div></section>';
      }

      if (c.sec.sources) {
        count++;
        sections += '<section class="card"><h2>🔗 Sources</h2><div class="srcs">' +
          '<a href="https://fr.wikipedia.org/wiki/' + wiki + '" target="_blank" class="src">📚 Wikipédia</a>' +
          '<a href="https://www.service-public.fr" target="_blank" class="src">🏛️ Service Public</a>' +
          '<a href="https://scholar.google.com/scholar?q=' + encodeURIComponent(subject) + '" target="_blank" class="src">🎓 Google Scholar</a>' +
          '</div></section>';
      }

      if (c.sec.quiz) {
        count++;
        sections += '<section class="card"><h2>🎯 Quiz</h2><div class="qz">' +
          '<p class="qz-q">Pourquoi vérifier ses sources ?</p>' +
          '<button class="qz-a" onclick="chk(this,1)">Pour éviter les fake news</button>' +
          '<button class="qz-a" onclick="chk(this,0)">Ce n\'est pas nécessaire</button>' +
          '</div></section>';
      }

      var html = '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">' +
        '<title>' + subject + '</title>' +
        '<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">' +
        '<style>' +
        '*{margin:0;padding:0;box-sizing:border-box}' +
        'body{font-family:Inter,sans-serif;background:#fafafa;color:#1a1a1a;line-height:1.6}' +
        'header{background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:2.5rem 1rem;text-align:center}' +
        '.badge{display:inline-block;padding:.2rem .7rem;background:rgba(255,255,255,.2);border-radius:20px;font-size:.7rem;margin-bottom:.8rem}' +
        'h1{font-family:Merriweather,serif;font-size:1.8rem}' +
        'main{max-width:700px;margin:0 auto;padding:1.5rem 1rem}' +
        '.card{background:#fff;border:1px solid #e5e5e5;border-radius:12px;padding:1.3rem;margin-bottom:1.2rem}' +
        '.card h2{font-family:Merriweather,serif;color:#2563eb;font-size:1.1rem;margin-bottom:.8rem}' +
        '.card p{color:#444}' +
        '.lead{font-size:1.05rem}' +
        '.ctx{background:#fef3c7;border:1px solid #fcd34d;border-radius:8px;padding:.8rem;margin-top:.8rem;font-size:.9rem}' +
        '.wiki{background:#f8f9fa;border:1px solid #a2a9b1;border-radius:8px;padding:1rem}' +
        '.wiki a{color:#3366cc;text-decoration:none}' +
        '.pts{list-style:none}' +
        '.pts li{padding:.6rem 0;padding-left:1.3rem;border-bottom:1px solid #eee;position:relative}' +
        '.pts li:before{content:"→";position:absolute;left:0;color:#2563eb}' +
        '.tl{border-left:2px solid #2563eb;padding-left:1.2rem}' +
        '.tl-i{padding:.8rem 0;position:relative}' +
        '.tl-i:before{content:"";position:absolute;left:-1.45rem;top:1rem;width:10px;height:10px;background:#2563eb;border-radius:50%}' +
        '.tl-i.now:before{background:#059669;box-shadow:0 0 0 4px rgba(5,150,105,.2)}' +
        '.tl-d{display:block;font-size:.75rem;font-weight:600;color:#2563eb}' +
        '.tl-c{color:#555;font-size:.9rem}' +
        '.srcs{display:flex;flex-wrap:wrap;gap:.6rem}' +
        '.src{display:inline-block;padding:.6rem 1rem;background:#f5f5f5;border:1px solid #ddd;border-radius:8px;text-decoration:none;color:#1a1a1a;font-size:.85rem}' +
        '.qz{background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border:1px solid #bae6fd;border-radius:12px;padding:1.2rem}' +
        '.qz-q{font-weight:600;margin-bottom:.8rem}' +
        '.qz-a{display:block;width:100%;padding:.7rem;margin-bottom:.5rem;background:#fff;border:1px solid #ddd;border-radius:8px;text-align:left;font-size:.9rem;cursor:pointer}' +
        '.qz-a.ok{background:#d1fae5;border-color:#059669}' +
        '.qz-a.no{background:#fee2e2;border-color:#dc2626}' +
        'footer{text-align:center;padding:1.5rem;color:#888;font-size:.8rem;border-top:1px solid #eee;margin-top:1.5rem}' +
        'footer a{color:#2563eb;text-decoration:none}' +
        '</style></head><body>' +
        '<header><div class="badge">📚 Fiche Éducative</div><h1>' + subject + '</h1></header>' +
        '<main>' + sections + '</main>' +
        '<footer><p>Généré par <b>PéTAL OS v329.2</b></p><p><a href="https://fr.wikipedia.org">Wikipédia</a> • <a href="https://www.service-public.fr">Service-Public.fr</a></p></footer>' +
        '<script>function chk(b,ok){var btns=document.querySelectorAll(".qz-a");for(var i=0;i<btns.length;i++)btns[i].disabled=true;b.classList.add(ok?"ok":"no")}<\/script>' +
        '</body></html>';

      return {
        subject: subject,
        date: now.toLocaleDateString('fr-FR'),
        audience: audLabels[c.audience] || 'Adultes',
        level: c.detail,
        sections: count,
        quiz: c.sec.quiz,
        sources: ['📚 Wikipédia', '🏛️ Service Public', '🎓 Scholar'],
        html: html
      };
    }

    // ════════════════════════════════════════════════════════════
    // MODAL
    // ════════════════════════════════════════════════════════════
    function openModal(idx) {
      editIdx = idx;
      var site = sites[idx];
      document.getElementById('modalTitle').textContent = site.subject;
      document.getElementById('modalCode').value = site.html;
      document.getElementById('modalPreview').srcdoc = site.html;
      document.getElementById('modalBg').classList.add('show');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalBg').classList.remove('show');
      document.body.style.overflow = '';
      if (editIdx >= 0) {
        sites[editIdx].html = document.getElementById('modalCode').value;
      }
      editIdx = -1;
    }

    function refreshModal() {
      document.getElementById('modalPreview').srcdoc = document.getElementById('modalCode').value;
    }

    function downloadModal() {
      var code = document.getElementById('modalCode').value;
      var name = editIdx >= 0 ? sites[editIdx].subject : 'fiche';
      download(code, name);
    }

    function downloadSite(idx) {
      download(sites[idx].html, sites[idx].subject);
    }

    function download(html, name) {
      var blob = new Blob([html], { type: 'text/html' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name.toLowerCase().replace(/\s+/g, '-') + '.html';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // ════════════════════════════════════════════════════════════
    // INIT
    // ════════════════════════════════════════════════════════════
    function init() {
      var list = document.getElementById('navList');
      for (var i = 0; i < modules.length; i++) {
        var li = document.createElement('li');
        li.className = 'nav-item';
        li.textContent = modules[i].name;
        li.setAttribute('data-id', modules[i].id);
        (function(id) {
          li.addEventListener('click', function() { loadMod(id); });
        })(modules[i].id);
        list.appendChild(li);
      }

      loadMod('home');
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
